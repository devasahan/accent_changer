# Every push: the JavaScript tests on Linux (unit tests, then the probe page and
# the app's page in headless Chromium), and the Rust shell's tests and lints on
# Windows. GitHub starts no run for a push whose newest commit message asks it
# to skip CI.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Probe page and app page in headless Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run test:app

  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Frontend into dist/ (the Rust build below embeds it)
        run: node scripts/copy-frontend.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri/custom-protocol, as `tauri build` adds it for the installer. Without
      # it tauri compiles in dev mode: the page comes from devUrl, nothing from
      # dist/ is embedded and the CSP isn't processed, so CI would never compile
      # what the installer ships.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --features tauri/custom-protocol -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --features tauri/custom-protocol
