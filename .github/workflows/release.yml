# The Windows installer (unsigned, per-user NSIS).
#   Run it by hand (Actions → Release → Run workflow): the installer is a
#   downloadable workflow artifact.
#   Push a tag like v0.1.0 (or v0.1.0-test.1 for a test build): the installer
#   is also attached to a GitHub release (a pre-release when the tag has a "-").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Accent Changer ${{ github.ref_name }}
          releaseBody: Windows installer (unsigned). SmartScreen may warn when you run it; choose More info, then Run anyway.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadWorkflowArtifacts: true
