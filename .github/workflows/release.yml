# The Windows installer (unsigned, per-user NSIS).
#   Run it by hand (Actions → Release → Run workflow): the installer is a
#   downloadable workflow artifact.
#   Push a tag like v0.1.0 (or v0.1.0-test.1 for a test build): the installer
#   is also attached to a GitHub release (a pre-release when the tag has a "-").
#   Tag a commit whose message has no [skip ci]: GitHub starts no workflow for
#   a tag pushed on such a commit, and shows nothing. To build that commit
#   anyway, run it by hand and pick the tag under "Use workflow from": that run
#   makes the release too.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The build runs code from every dependency (npm scripts, crate build
      # scripts and macros). It gets no write token from the git config, and
      # only a release run puts one in its environment (see tauri-action below).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          # tauri-action reads this token only to create the release and upload
          # to it, which only tag runs do; the workflow artifact goes up with the
          # run's own artifact token. The build runs inside this step, so in a
          # tag run it can still read the token: only a separate publishing job
          # would keep it out.
          GITHUB_TOKEN: ${{ github.ref_type == 'tag' && secrets.GITHUB_TOKEN || '' }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Accent Changer ${{ github.ref_name }}
          releaseBody: |
            Windows installer: the `.exe` file under Assets. It isn't signed, so Edge and Windows don't know it yet.

            - If Edge says the file isn't commonly downloaded: click **…** next to it, then **Keep**, then **Show more**, then **Keep anyway**.
            - If Windows shows "Windows protected your PC": click **More info**, then **Run anyway**.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadWorkflowArtifacts: true
      # Windows starts the app only with its application manifest, which asks
      # for Common Controls v6 (src-tauri/build.rs has the linker embed it).
      # Read it back from every app .exe the build made, so a build that
      # would not start fails here instead of on someone's PC.
      - name: Check the app's Windows manifest
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem src-tauri/target/release -Filter *.exe -File)
          if ($exes.Count -eq 0) { throw "no app .exe in src-tauri/target/release" }
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw "mt.exe (Windows SDK) not found" }
          foreach ($exe in $exes) {
            $out = Join-Path $env:RUNNER_TEMP "$($exe.BaseName).manifest"
            & $mt.FullName -nologo "-inputresource:$($exe.FullName);#1" "-out:$out"
            if ($LASTEXITCODE -ne 0) { throw "$($exe.Name) has no application manifest" }
            $manifest = Get-Content $out -Raw
            Write-Output "$($exe.Name):" $manifest
            if ($manifest -notmatch 'Microsoft\.Windows\.Common-Controls' -or $manifest -notmatch '6\.0\.0\.0') {
              throw "$($exe.Name)'s manifest does not ask for Common Controls 6.0"
            }
          }
