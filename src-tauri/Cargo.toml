[package]
name = "accent-changer"
version = "0.1.0"
description = "Accent Changer: a live US accent for your own interview calls"
edition = "2021"
# The highest rust-version among the locked crates (tauri 2.12 and its plugins).
rust-version = "1.90"
publish = false

[lib]
name = "accent_changer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
keyring = "4.2"
# Windows' own TLS and proxy settings (SChannel), not a bundled certificate list:
# antivirus HTTPS scanning and company proxies keep working, and the binary stays small.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1", features = ["sync", "time"] }

# The same versions Tauri 2.12 and wry already use (see Cargo.lock), so nothing
# new is downloaded: WebView2's permission call (permission.rs) and the
# window's quiet re-show (window.rs). They may change with a Tauri minor release.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# "test" adds a mock app without a window, for the log settings test (lib.rs).
tauri = { version = "2.12", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
